[project]
name = "persistent-sandboxes"
version = "0.1.0"
description = "Persistent Firecracker sandboxes for long-running coding agents"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # lets tests `import node_agent` from the repo root
