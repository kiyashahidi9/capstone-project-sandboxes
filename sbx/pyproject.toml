[project]
name = "persistent-sandboxes"
version = "0.1.0"
description = "Persistent Firecracker sandboxes for long-running coding agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "openai>=3.49.0",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # lets tests `import host_manager` from the repo root

# installs sdk/ into the venv, so `from sdk.sandbox import Sandbox` works from any folder (e.g. /opt/agents)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdk"]
